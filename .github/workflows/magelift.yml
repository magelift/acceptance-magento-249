name: MageLift CI

# target: gcp/gke-autopilot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize acceptance target
        env:
          MAGELIFT_ACCEPTANCE_CONFIG: ${{ vars.MAGELIFT_ACCEPTANCE_CONFIG }}
        run: |
          python3 - <<'PY_CONFIG'
          import os
          from pathlib import Path
          value = os.environ["MAGELIFT_ACCEPTANCE_CONFIG"]
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              value = Path("magelift.yaml").read_text()
          elif not value.strip():
              raise SystemExit("MAGELIFT_ACCEPTANCE_CONFIG is required for acceptance")
          Path("magelift.acceptance.yaml").write_text(value)
          PY_CONFIG
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v0.0.0-canary.2e75d313b03d53dd7cfe694297032bf8d69cc2ed
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift providers install
      - name: Validate configuration
        run: magelift --config 'magelift.acceptance.yaml' --no-interaction config validate
      - name: Resolve environment
        run: magelift --config 'magelift.acceptance.yaml' --env "${{ matrix.environment }}" --no-interaction --output json config effective > /dev/null

  build:
    name: Build and sign immutable image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize acceptance target
        env:
          MAGELIFT_ACCEPTANCE_CONFIG: ${{ vars.MAGELIFT_ACCEPTANCE_CONFIG }}
        run: |
          python3 - <<'PY_CONFIG'
          import os
          from pathlib import Path
          value = os.environ["MAGELIFT_ACCEPTANCE_CONFIG"]
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              value = Path("magelift.yaml").read_text()
          elif not value.strip():
              raise SystemExit("MAGELIFT_ACCEPTANCE_CONFIG is required for acceptance")
          Path("magelift.acceptance.yaml").write_text(value)
          PY_CONFIG
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Validate GCP federation variables
        env:
          GCP_PROJECT_ID: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.MAGELIFT_GCP_BUILD_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_WIF_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MAGELIFT_GCP_BUILD_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Relocate GCP federated credentials
        run: |
          set -eu
          src="${GOOGLE_GHA_CREDS_PATH:?GOOGLE_GHA_CREDS_PATH is required}"
          workspace_real="$(realpath -- "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}")"
          runner_temp="$(realpath -- "${RUNNER_TEMP:?RUNNER_TEMP is required}")"
          if [ -L "$src" ] || [ ! -f "$src" ]; then
            echo 'credential file must be a regular file' >&2
            exit 1
          fi
          src_real="$(realpath -- "$src")"
          case "$src_real" in
            "$workspace_real"/gha-creds-*.json) ;;
            *) echo 'unexpected credential file outside GITHUB_WORKSPACE or with an invalid name' >&2; exit 1 ;;
          esac
          case "$runner_temp" in
            "$workspace_real"|"$workspace_real"/*)
              echo 'configure RUNNER_TEMP outside GITHUB_WORKSPACE' >&2
              exit 1 ;;
          esac
          dest="$(mktemp "$runner_temp/gha-creds-reloc-XXXXXXXX")"
          cleanup() { rm -f -- "$dest"; }
          trap cleanup EXIT
          mv -- "$src" "$dest"
          chmod 0600 "$dest"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$dest"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$dest"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$dest"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          version: '589.0.0'
      - name: Validate registry destination
        env:
          IMAGE: ${{ vars.MAGELIFT_RELEASE_IMAGE }}
          REGISTRY: ${{ vars.MAGELIFT_REGISTRY }}
        run: |
          set -eu
          test -n "$IMAGE"
          test -n "$REGISTRY"
          test "${IMAGE%%/*}" = "$REGISTRY"
      - name: Authenticate Artifact Registry
        if: endsWith(vars.MAGELIFT_REGISTRY, '-docker.pkg.dev')
        env:
          REGISTRY: ${{ vars.MAGELIFT_REGISTRY }}
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Authenticate user GHCR repository
        if: vars.MAGELIFT_REGISTRY == 'ghcr.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate generic registry credentials
        if: vars.MAGELIFT_REGISTRY != 'ghcr.io' && !endsWith(vars.MAGELIFT_REGISTRY, '-docker.pkg.dev')
        env:
          USERNAME: ${{ vars.MAGELIFT_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.MAGELIFT_REGISTRY_PASSWORD }}
        run: |
          test -n "$USERNAME"
          test -n "$PASSWORD"
      - name: Authenticate user registry
        if: vars.MAGELIFT_REGISTRY != 'ghcr.io' && !endsWith(vars.MAGELIFT_REGISTRY, '-docker.pkg.dev')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.MAGELIFT_REGISTRY }}
          username: ${{ vars.MAGELIFT_REGISTRY_USERNAME }}
          password: ${{ secrets.MAGELIFT_REGISTRY_PASSWORD }}
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v0.0.0-canary.2e75d313b03d53dd7cfe694297032bf8d69cc2ed
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Build and sign image
        id: build
        env:
          MAGELIFT_RELEASE_IMAGE: ${{ vars.MAGELIFT_RELEASE_IMAGE }}
          COMPOSER_AUTH: ${{ secrets.MAGELIFT_COMPOSER_AUTH }}
        run: |
          set -eu
          test -n "$MAGELIFT_RELEASE_IMAGE"
          image="$MAGELIFT_RELEASE_IMAGE"
          case "${image##*/}" in
            *:*) ;;
            *)
              printf '%s' "$GITHUB_SHA" | grep -Eq '^[a-f0-9]{40}$'
              image="$image:$GITHUB_SHA"
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/magelift-build"
          result="$RUNNER_TEMP/magelift-build/build-result.json"
          magelift --config 'magelift.acceptance.yaml' --no-interaction --output json build --push \
            --image "$image" > "$result"
          digest="$(jq -er '.image | (.imageReference | sub(":[^/:]+$"; "")) + "@" + .digest' "$result")"
          cp -- "$(jq -er '.manifest' "$result")" "$RUNNER_TEMP/magelift-build/manifest.json"
          checksum="$(jq -er '.manifestSha256 | select(test("^[a-f0-9]{64}$"))' "$result")"
          printf '%s  manifest.json\n' "$checksum" > "$RUNNER_TEMP/magelift-build/manifest.sha256"
          (cd "$RUNNER_TEMP/magelift-build" && sha256sum -c manifest.sha256)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Retain existing artifact manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magelift-build-${{ github.run_id }}
          path: ${{ runner.temp }}/magelift-build/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Deploy test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: magelift-test-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize acceptance target
        env:
          MAGELIFT_ACCEPTANCE_CONFIG: ${{ vars.MAGELIFT_ACCEPTANCE_CONFIG }}
        run: |
          python3 - <<'PY_CONFIG'
          import os
          from pathlib import Path
          value = os.environ["MAGELIFT_ACCEPTANCE_CONFIG"]
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              value = Path("magelift.yaml").read_text()
          elif not value.strip():
              raise SystemExit("MAGELIFT_ACCEPTANCE_CONFIG is required for acceptance")
          Path("magelift.acceptance.yaml").write_text(value)
          PY_CONFIG
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install MageLift
        env:
          MAGELIFT_VERSION: v0.0.0-canary.2e75d313b03d53dd7cfe694297032bf8d69cc2ed
        run: |
          set -eu
          archive="magelift_${MAGELIFT_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/magelift/magelift/releases/download/$MAGELIFT_VERSION"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$archive" "$base/$archive"
          curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$tmp/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$tmp/checksums.txt.sigstore.json" --certificate-identity "https://github.com/magelift/magelift/.github/workflows/release.yml@refs/tags/$MAGELIFT_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/checksums.txt"
          (cd "$tmp" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$archive" -C "$tmp" magelift
          sudo install -m 0755 "$tmp/magelift" /usr/local/bin/magelift
          magelift version
      - name: Install MageLift provider
        run: magelift providers install
      - name: Validate GCP deployment variables
        env:
          GCP_PROJECT_ID: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.MAGELIFT_GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.MAGELIFT_GCP_TEST_SERVICE_ACCOUNT }}
        run: |
          set -eu
          test -n "$GCP_PROJECT_ID"
          configured_project="$(magelift --config magelift.acceptance.yaml --env test --output json config effective | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["target"]["gcp"]["project"])')"
          test "$GCP_PROJECT_ID" = "$configured_project"
          test -n "$GCP_REGION"
          test "$GCP_REGION" = 'us-central1'
          test -n "$GCP_WIF_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.MAGELIFT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.MAGELIFT_GCP_TEST_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Relocate GCP federated credentials
        run: |
          set -eu
          src="${GOOGLE_GHA_CREDS_PATH:?GOOGLE_GHA_CREDS_PATH is required}"
          workspace_real="$(realpath -- "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}")"
          runner_temp="$(realpath -- "${RUNNER_TEMP:?RUNNER_TEMP is required}")"
          if [ -L "$src" ] || [ ! -f "$src" ]; then
            echo 'credential file must be a regular file' >&2
            exit 1
          fi
          src_real="$(realpath -- "$src")"
          case "$src_real" in
            "$workspace_real"/gha-creds-*.json) ;;
            *) echo 'unexpected credential file outside GITHUB_WORKSPACE or with an invalid name' >&2; exit 1 ;;
          esac
          case "$runner_temp" in
            "$workspace_real"|"$workspace_real"/*)
              echo 'configure RUNNER_TEMP outside GITHUB_WORKSPACE' >&2
              exit 1 ;;
          esac
          dest="$(mktemp "$runner_temp/gha-creds-reloc-XXXXXXXX")"
          cleanup() { rm -f -- "$dest"; }
          trap cleanup EXIT
          mv -- "$src" "$dest"
          chmod 0600 "$dest"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$dest"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$dest"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$dest"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.MAGELIFT_GCP_PROJECT_ID }}
          version: '589.0.0'
      - name: Download existing artifact manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: magelift-build-${{ github.run_id }}
          path: ${{ runner.temp }}/magelift-build/
      - name: Verify artifact handoff
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        working-directory: ${{ runner.temp }}/magelift-build/
        run: |
          set -eu
          sha256sum -c manifest.sha256
          test "$(jq -er '.image | (.imageReference | sub(":[^/:]+$"; "")) + "@" + .digest' build-result.json)" = "$DIGEST"
          test "$(jq -er '.imageDigest' manifest.json)" = "${DIGEST##*@}"
      - name: Deploy immutable digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: magelift --config 'magelift.acceptance.yaml' --env test --no-interaction --yes deploy --digest "$DIGEST"
